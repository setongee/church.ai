<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — FAFC Media Engine</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fafafa; color: #171717; text-align: center; padding: 24px; }
      .card { max-width: 340px; }
      .logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #737373; line-height: 1.5; }
      button { background: #ea580c; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>FAFC Media Engine needs a connection to load. Check your Wi-Fi or data, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
